name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck · check · knip · tests · storybook · smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm build-storybook
      - run: pnpm check-storybook-index
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm smoke-storybook
